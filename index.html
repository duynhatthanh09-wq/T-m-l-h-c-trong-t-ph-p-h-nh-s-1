,"sourceNumber":194,"text":"Trong hoạt động lấy lời khai người làm chứng, để tác động đến tâm lý của đối tượng bị xét hỏi, Điều tra viên có thể sử dụng phương pháp nào?","options":["Phương pháp thuyết phục.","Phương pháp ám thị trực tiếp và ám thị gián tiếp.","Phương pháp phân tích sản phẩm hoạt động.","Phương pháp mệnh lệnh."],"correct":0,"explanation":"Chương 3: Đặc điểm tâm lý của hoạt động điều tra","inferred":false},{"id":193,"sourceNumber":195,"text":"Trong hoạt động bào chữa, người bào chữa sử dụng phương pháp truyền đạt thông tin cho chủ thể nào sau đây?","options":["Người bị buộc tội, người tiến hành tố tụng và người tham gia tố tụng.","Người tiến hành tố tụng.","Người bị buộc tội và người tiến hành tố tụng.","Người bị buộc tội."],"correct":2,"explanation":"Chương 5: Đặc điểm tâm lý của hoạt động bào chữa","inferred":false},{"id":194,"sourceNumber":196,"text":"Phương pháp quan sát được hiểu như thế nào?","options":["Là phương pháp dùng thị giác để quan sát các biểu hiện bề ngoài (hành vi, thái độ) của con người một cách có tổ chức, có hệ thống và có mục đích rõ ràng, từ đó nhận thức về tâm lý của người được quan sát.","Là phương pháp dùng thị giác để quan sát để nhằm đánh giá tâm lý của các chủ thể tham gia tố tụng và chủ thể tiến hành tố tụng.","Là phương pháp dùng thị giác để quan sát các biểu hiện bề ngoài (hành vi, thái độ) của người phạm tội một cách có tổ chức, có hệ thống và có mục đích rõ ràng, từ đó nhận thức về tâm lý của người phạm tội.","Là phương pháp dùng thị giác để quan sát các biểu hiện bề ngoài (hành vi, thái độ) của các chủ thể tham gia tố tụng."],"correct":0,"explanation":"Chương 1: Khái niệm Tâm lý học tư pháp và vị trí của Tâm lý học tư pháp trong hệ thống các khoa học","inferred":false},{"id":195,"sourceNumber":197,"text":"Để giáo dục bị can hiệu quả trong giai đoạn điều tra, Điều tra viên cần nghiên cứu vấn đề nào sau đây?","options":["Môi trường sống và những mối quan hệ xã hội của bị can.","Đặc điểm nhân thân của bị can.","Tình huống, hoàn cảnh phạm tội.","Đặc điểm nhân thân của bị can, môi trường sống và những mối quan hệ xã hội của bị can, tình huống, hoàn cảnh phạm tội."],"correct":3,"explanation":"Chương 3: Đặc điểm tâm lý của hoạt động điều tra","inferred":false},{"id":196,"sourceNumber":198,"text":"Giao tiếp giữa người bào chữa và người bị buộc tội (thân chủ) là giao tiếp mang tính chất nào sau đây?","options":["Giao tiếp mang tính đồng thuận.","Giao tiếp mang tính trái chiều.","Giao tiếp mang tính đa chiều.","Giao tiếp mang tính đối kháng."],"correct":0,"explanation":"Chương 5: Đặc điểm tâm lý của hoạt động bào chữa","inferred":false},{"id":197,"sourceNumber":199,"text":"Hoạt động giao tiếp trong hoạt động tư pháp là gì?","options":["Hoạt động sử dụng phương tiện giao tiếp giữa những chủ thể tham gia tố tụng.","Hoạt động sử dụng phương tiện giao tiếp bằng ngôn ngữ hoặc phi ngôn ngữ giữa người với người.","Hoạt động sử dụng phương tiện giao tiếp bằng ngôn ngữ hoặc phi ngôn ngữ giữa những chủ thể tham gia vào quá trình giải quyết vụ án hình sự và cải tạo phạm nhân, qua đó hiểu biết, chia sẻ, phản biện lẫn nhau tạo ảnh hưởng tích cực đến hoạt động tư pháp.","Hoạt động sử dụng phương tiện giao tiếp bằng ngôn ngữ giữa những chủ thể tham gia vào quá trình giải quyết vụ án hình sự và cải tạo phạm nhân, qua đó hiểu biết, chia sẻ, phản biện lẫn nhau tạo ảnh hưởng tích cực đến hoạt động tư pháp."],"correct":2,"explanation":"Chương 2: Cấu trúc tâm lý hoạt động tư pháp và phương pháp tác động tâm lý","inferred":false},{"id":198,"sourceNumber":200,"text":"Nhận định nào sau đây là Đúng về phương pháp giao tiếp tâm lý có điều kiện?","options":["Phương pháp giao tiếp tâm lý có điều khiển được áp dụng khi có mâu thuẫn giữa các chứng cứ, lời khai cần nhận dạng, đối chất.","Phương pháp giao tiếp tâm lý có điều khiển được áp dụng khi người khai báo quên một số tình tiết của vụ án.","Phương pháp giao tiếp tâm lý có điều khiển được áp dụng khi cần làm thay đổi thái độ, quan điểm, lập trường sai lệch của người bị tác động.","Phương pháp giao tiếp tâm lý có điều khiển được áp dụng trong giai đoạn cải tạo đối với phạm nhân thông qua hoạt động giáo dục, tuyên truyền."],"correct":0,"explanation":"Chương 2: Cấu trúc tâm lý hoạt động tư pháp và phương pháp tác động tâm lý","inferred":false},{"id":199,"sourceNumber":201,"text":"Khi bị hại có biểu hiện bất hợp tác, cố tình giấu giếm sự thật thì cần áp dụng phương pháp tâm lý nào sau đây?","options":["Phương pháp thuyết phục.","Phương pháp giao tiếp có điều khiển.","Phương pháp mệnh lệnh.","Phương pháp truyền đạt thông tin."],"correct":0,"explanation":"Chương 4: Đặc điểm tâm lý của hoạt động xét xử","inferred":false},{"id":200,"sourceNumber":202,"text":"Phương pháp đàm thoại được hiểu như thế nào?","options":["Là phương pháp nghiên cứu tâm lý cá nhân thông qua giao tiếp và đặt câu hỏi có nội dung, mục đích, kế hoạch được định sẵn. Thông qua đàm thoại, tâm lý của cá nhân được bộc lộ và có thể nhận thức được.","Là phương pháp nghiên cứu tâm lý cá nhân thông qua giao tiếp chỉ được thực hiện trong quá trình tiến hành tố tụng.","Là phương pháp nghiên cứu tâm lý cá nhân thông qua giao tiếp có nội dung, mục đích, kế hoạch được định sẵn. Thông qua đàm thoại, tâm lý của cá nhân được bộc lộ và có thể nhận thức được.","Là phương pháp nghiên cứu tâm lý cá nhân thông qua việc hỏi và trả lời giữa người có thẩm quyền tiến hành tố tụng và người tham gia tố tụng."],"correct":0,"explanation":"Chương 1: Khái niệm Tâm lý học tư pháp và vị trí của Tâm lý học tư pháp trong hệ thống các khoa học","inferred":false},{"id":201,"sourceNumber":203,"text":"Bị cáo có thái độ quanh co, chối tội, bất hợp tác là đặc điểm tâm lý tiêu cực của người nào sau đây?","options":["Người chưa thành niên phạm tội.","Người phạm tội lần đầu.","Người phạm tội tái phạm, chuyên nghiệp.","Người phạm tội."],"correct":2,"explanation":"Chương 4: Đặc điểm tâm lý của hoạt động xét xử","inferred":false},{"id":202,"sourceNumber":204,"text":"Trong phương pháp quan sát thì có bao nhiêu loại quan sát?","options":["05 loại.","04 loại.","06 loại.","03 loại."],"correct":0,"explanation":"Chương 1: Khái niệm Tâm lý học tư pháp và vị trí của Tâm lý học tư pháp trong hệ thống các khoa học","inferred":false},{"id":203,"sourceNumber":205,"text":"Đặc điểm tâm lý tiêu cực của người làm chứng là gì?","options":["Mong muốn vụ án được xử lý nghiêm minh.","Bức xúc, căm phẫn với hành vi phạm tội của bị cáo.","Không tự tin vào lời khai của mình khi có nhiều người làm chứng khác mà lời khia không thống nhất.","Mong muốn bị cáo bị xử lý đúng tội."],"correct":2,"explanation":"Chương 4: Đặc điểm tâm lý của hoạt động xét xử","inferred":false},{"id":204,"sourceNumber":206,"text":"Các quyết định được đưa ra trong hoạt động xét xử bao gồm:","options":["Quyết định thành lập hội đồng xét xử.","Quyết định đưa vụ án ra xét xử.","Quyết định triệu tập những người tham gia tố tụng.","Quyết định thành lập hội đồng xét xử; Quyết định đưa vụ án ra xét xử; Quyết định triệu tập những người tham gia tố tụng."],"correct":3,"explanation":"Chương 4: Đặc điểm tâm lý của hoạt động xét xử","inferred":false},{"id":205,"sourceNumber":207,"text":"Tâm lý của bị can phạm tội chuyên nghiệp, tái phạm, phạm tội có tổ chức thường có biểu hiện nào sau đây?","options":["Bất hợp tác, im lặng không khai báo.","Quanh co, chối tội, đổ lỗi cho người khác; bất hợp tác, im lặng không khai báo.","Quanh co, chối tội, đổ lỗi cho người khác.","Thiếu tự tin, nhận thức hạn chế nên thường khai báo không đúng; quanh co, chối tội, đổ lỗi cho người khác; bất hợp tác, im lặng không khai báo."],"correct":1,"explanation":"Chương 3: Đặc điểm tâm lý của hoạt động điều tra","inferred":false},{"id":206,"sourceNumber":208,"text":"“người bào chữa phải cung cấp các quy định về pháp luật để hướng đến một hành xử đúng cho người bào chữa” nội dung này cần sử dụng phương pháp tác động nào sau đây?","options":["Phương pháp truyền đạt thông tin.","Phương pháp thuyết phục.","Phương pháp đặt vấn đề và thay đổi tư duy.","Phương pháp giao tiếp."],"correct":0,"explanation":"Chương 5: Đặc điểm tâm lý của hoạt động bào chữa","inferred":false},{"id":207,"sourceNumber":209,"text":"Cấu trúc tâm lý hoạt động tư pháp là gì?","options":["Là hệ thống các hoạt động được thực hiện thường xuyên trong quá trình điều tra, xét xử và thi hành án hình sự. Mỗi hoạt động có nhiệm vụ riêng, mục đích riêng qua đó thỏa mãn mục đích chung là xác định sự thật vụ án hình sự, giải quyết vụ án hình sự và giáo dục, cải tạo người phạm tội, bảo vệ lợi ích nhà nước, tập thể và công dân.","Là hệ thống các hoạt động được thực hiện thường xuyên trong quá trình điều tra, xét xử và thi hành án hình sự. Mỗi hoạt động có nhiệm vụ riêng, mục đích riêng qua đó thỏa mãn mục đích chung là xác định sự thật vụ án hình sự.","Là hệ thống các hoạt động có nhiệm vụ riêng, mục đích riêng qua đó thỏa mãn mục đích chung là xác định sự thật vụ án hình sự, giải quyết vụ án hình sự và giáo dục, cải tạo người phạm tội, bảo vệ lợi ích nhà nước, tập thể và công dân.","Là hệ thống các hoạt động được thực hiện thường xuyên trong quá trình điều tra, xét xử và thi hành án hình sự."],"correct":0,"explanation":"Chương 2: Cấu trúc tâm lý hoạt động tư pháp và phương pháp tác động tâm lý","inferred":false},{"id":208,"sourceNumber":210,"text":"Nhằm hiểu được diễn biến tâm lý của đối tượng mà ta quan tâm: suy nghĩ, tâm trạng, xúc cảm của đối tượng, có thể đoán được họ đang nghĩ gì, thái độ ra sao thì sử dụng phương pháp nghiên cứu tâm lý nào sau đây?","options":["Phương pháp thực nghiệm.","Phương pháp đàm thoại; Phương pháp thực nghiệm; Phương pháp quan sát.","Phương pháp đàm thoại.","Phương pháp quan sát."],"correct":1,"explanation":"Chương 1: Khái niệm Tâm lý học tư pháp và vị trí của Tâm lý học tư pháp trong hệ thống các khoa học","inferred":false},{"id":209,"sourceNumber":211,"text":"Rào cản nào sau đây của người bị buộc tội (thân chủ) trong việc thiết lập giao tiếp tâm lý với người bào chữa?","options":["Sẵn sàng chia sẻ, kể lại toàn bộ hành vi phạm tội của mìn  Khái niệm Tâm lý học tư pháp và vị trí của Tâm lý học tư pháp trong hệ thống các khoa học","inferred":false},{"id":229,"sourceNumber":231,"text":"Vai trò giáo dục chủ yếu được thực hiện bởi chủ thể nào sau đây?","options":["Người tiến hành tố tụng.","Thẩm phán, Hội thẩm, Kiểm sát viên.","Thẩm phán, Hội thẩm.","Thẩm phán."],"correct":1,"explanation":"Chương 4: Đặc điểm tâm lý của hoạt động xét xử","inferred":false},{"id":230,"sourceNumber":232,"text":"Các yếu tố của giao tếp bao gồm:","options":["Nguồn truyền đạt thông tin là người; phương tiện truyền đạt thông tin là ngôn ngữ hoặc phi ngôn ngữ.","Nguồn truyền đạt thông tin là người; phương tiện truyền đạt thông tin là lời nói; phương tiện tiếp nhận thông tin là các giác quan.","Nguồn truyền đạt thông tin là người; phương tiện truyền đạt thông tin là ngôn ngữ hoặc phi ngôn ngữ; phương tiện tiếp nhận thông tin là các giác quan.","Phương tiện truyền đạt thông tin là ngôn ngữ hoặc phi ngôn ngữ; phương tiện tiếp nhận thông tin là các giác quan."],"correct":2,"explanation":"Chương 2: Cấu trúc tâm lý hoạt động tư pháp và phương pháp tác động tâm lý","inferred":false},{"id":231,"sourceNumber":233,"text":"Để thành công trong việc thiết lập giao tiếp tâm lý thì người bào chữa không được làm gì?","options":["Tâm lý mang tính phán xét, lên án.","Thái độ khoan dung, tôn trọng và chân tình.","Người bào chữa phải luôn cân nhắc, quan tâm đến tâm lý của người bị buộc tội.","Có thái độ khách quan, xác định đúng sự thật vụ án, hành vi người phạm tội."],"correct":0,"explanation":"Chương 5: Đặc điểm tâm lý của hoạt động bào chữa","inferred":false},{"id":232,"sourceNumber":234,"text":"Thao tác lập kế hoạch trong thiết kế của hoạt động bào chữa cần thực hiện là gì?","options":["Soạn thảo kế hoạch bào chữa và lên phương án, phương pháp và chiến thuật bào chữa.","Lên phương án, phương pháp và chiến thuật bào chữa.","Soạn thảo kế hoạch bào chữa.","Dự liệu những diễn biến, hành vi xảy ra bất ngờ tại phiên tòa và tâm thế đối phó với những tình huống đó."],"correct":0,"explanation":"Chương 5: Đặc điểm tâm lý của hoạt động bào chữa","inferred":false},{"id":233,"sourceNumber":235,"text":"Phương pháp thuyết phục được chia thành các loại nào sau đây?","options":["Thuyết phục logic; thuyết phục tình cảm.","Thuyết phục logic; thuyết phục pháp lý.","Thuyết phục quy định; thuyết phục đạo đức.","Thuyết phục tình cảm; thuyết phục pháp lý."],"correct":0,"explanation":"Chương 2: Cấu trúc tâm lý hoạt động tư pháp và phương pháp tác động tâm lý","inferred":false},{"id":234,"sourceNumber":236,"text":"Phương hướng khắc phục trong tâm lý tiêu cực cần khắc phục của người bào chữa?","options":["Có năng lực giao tiếp.","Có năng lực diễn đạt và giao tiếp.","Mềm dẻo, tôn trọng nhưng cương quyết với đối tượng giao tiếp.","Có năng lực tổ chức."],"correct":2,"explanation":"Chương 5: Đặc điểm tâm lý của hoạt động bào chữa","inferred":false},{"id":235,"sourceNumber":237,"text":"Yếu tố nào sau đây không được thực hiện khi thiết lập giao tiếp tâm lý giữa người bào chữa và Thẩm phán?","options":["Thái độ mềm dẻo nhưng cương quyết.","Thái độ cương quyết.","Thái độ gay gắt, chỉ trích Thẩm phán.","Thái độ khách quan, thuyết phục."],"correct":2,"explanation":"Chương 5: Đặc điểm tâm lý của hoạt động bào chữa","inferred":false},{"id":236,"sourceNumber":238,"text":"Yếu tố nào sau đây ảnh hưởng đến tâm lý của bị cáo?","options":["Kinh nghiệm của bản thân bị cáo đối với cuộc sống.","Nhận thức của bị cáo đối với sự buộc tội.","Nhận thức của bị cáo đối với sự buộc tội; kinh nghiệm của bản thân bị cáo đối với cuộc sống; dư luận xã hội về vụ án.","Dư luận xã hội về vụ án."],"correct":2,"explanation":"Chương 4: Đặc điểm tâm lý của hoạt động xét xử","inferred":false}]</script>
<script>
'use strict';
const BANK=JSON.parse(document.getElementById('bank').textContent);
const LETTERS='ABCD';
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const groups=Array.from({length:Math.ceil(BANK.length/25)},(_,i)=>BANK.slice(i*25,i*25+25));
function fresh(group){return {items:shuffle(group).map(q=>({q,order:shuffle([0,1,2,3]),selected:null})),submitted:false}}
const sessions=groups.map(fresh);
let current=0,searchTerm='';
const main=document.getElementById('main'),nav=document.getElementById('nav');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function folded(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase()}
function highlight(s,term){if(!term)return esc(s);let normalized='',positions=[];let index=0;for(const c of s){const f=folded(c);for(const x of f){normalized+=x;positions.push({start:index,end:index+c.length})}index+=c.length}const needle=folded(term);if(!needle)return esc(s);let from=0,last=0,out='',pos;while((pos=normalized.indexOf(needle,from))!==-1){const start=positions[pos].start,end=positions[pos+needle.length-1].end;out+=esc(s.slice(last,start))+'<mark>'+esc(s.slice(start,end))+'</mark>';last=end;from=pos+needle.length}return out+esc(s.slice(last))}
function card(item,i,summary=false,term=''){
 const {q,order,selected}=item,answered=selected!==null,n=summary?q.id:i+1;
 const correctLetter=LETTERS[order.indexOf(q.correct)],good=selected===q.correct;
 const content=order.map((original,j)=>{
  const correct=(summary||answered)&&original===q.correct,wrong=!summary&&answered&&original===selected&&!correct;
  const cls=correct?' correct':wrong?' wrong':'';
  const tag=summary?'div':'button';
  const attrs=summary?'':` type="button" data-option="${original}" aria-label="${LETTERS[j]}. ${esc(q.options[original])}"${answered?' disabled':''}`;
  return `<${tag} class="option${cls}"${attrs}><span class="letter">${LETTERS[j]}</span><span class="option-text">${highlight(q.options[original],term)}${correct?'<span class="indicator">✓ Đúng</span>':wrong?'<span class="indicator">✕ Đã chọn</span>':''}</span></${tag}>`
 }).join('');
 return `<article class="question" id="q-${n}" data-id="${q.id}" aria-labelledby="title-${n}"><div class="q-top"><span class="q-number">Câu ${n}</span><span class="state">${summary?'Đáp án từ LMS':answered?'Đã trả lời':'Chọn một đáp án'}</span></div>${q.inferred?'<p class="inferred">suy luận</p>':''}<h3 class="q-text" id="title-${n}" tabindex="-1">${highlight(q.text,term)}</h3><div class="options">${content}</div><div class="feedback" aria-live="polite"${summary||answered?'':' hidden'}>${summary||answered?`${summary?'':`<span class="verdict ${good?'good-text':'bad-text'}">${good?'✓ Chính xác':'✕ Chưa chính xác'}</span>`}<strong>Đáp án đúng: ${correctLetter}.</strong> ${highlight(q.options[q.correct],term)}${q.explanation?`<br>Giải thích từ LMS: ${highlight(q.explanation,term)}`:''}`:''}</div></article>`
}
function stats(){const items=sessions[current].items;const done=items.filter(x=>x.selected!==null).length,correct=items.filter(x=>x.selected===x.q.correct).length;return {total:items.length,done,correct,wrong:done-correct,unanswered:items.length-done}}
function updateStats(){const s=stats();document.getElementById('done').textContent=s.done+'/'+s.total;document.getElementById('correct').textContent=s.correct;document.getElementById('wrong').textContent=s.wrong}
function measure(){document.documentElement.style.setProperty('--head-height',document.getElementById('header').getBoundingClientRect().height+'px');const toolbar=document.getElementById('toolbar');document.documentElement.style.setProperty('--bar-height',(toolbar?toolbar.getBoundingClientRect().height:0)+'px')}
new ResizeObserver(measure).observe(document.getElementById('header'));
const barObserver=new ResizeObserver(measure);
function topOfPart(){measure();document.getElementById('part-title').focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'})}
function renderNav(){nav.innerHTML=groups.map((g,i)=>`<button type="button" class="tab${current===i?' active':''}" data-part="${i}" aria-pressed="${current===i}">Phần ${i+1}<small>${g.length} câu</small></button>`).join('')+`<button type="button" class="tab summary${current===-1?' active':''}" data-part="-1" aria-pressed="${current===-1}">★ Tổng hợp<small>${BANK.length} câu</small></button>`}
function render(){
 barObserver.disconnect();renderNav();
 if(current===-1){
  main.innerHTML=`<section aria-labelledby="part-title"><div class="intro"><h2 id="part-title" tabindex="-1">★ Tổng hợp · ${BANK.length} câu</h2><p>Toàn bộ câu theo thứ tự gốc, đã tô sẵn đáp án đúng.</p></div><div class="searchbox"><label for="search">Tìm trong câu hỏi, đáp án hoặc giải thích (có thể gõ không dấu)</label><div class="searchline"><input type="search" id="search" placeholder="Ví dụ: nhận thức, thuyết phục, hoạt động bào chữa…" autocomplete="off" value="${esc(searchTerm)}"><button type="button" class="clear" id="clear">Xóa</button></div><p class="search-count" id="search-count" aria-live="polite"></p></div><div id="summary-list"></div></section>`;
  renderSummary();document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value;renderSummary()});document.getElementById('clear').onclick=()=>{searchTerm='';document.getElementById('search').value='';renderSummary();document.getElementById('search').focus()};
 }else{
  const g=groups[current],session=sessions[current];
  main.innerHTML=`<section aria-labelledby="part-title"><div class="intro"><h2 id="part-title" tabindex="-1">Phần ${current+1} · ${g.length} câu</h2><p>Nhóm cố định: câu ${g[0].id}–${g[g.length-1].id} trong ngân hàng. Chọn đáp án để xem ngay kết quả.</p><p>Mỗi câu chọn một lần; dùng Làm lại hoặc Trộn lại để luyện tiếp.</p></div><div class="toolbar" id="toolbar"><div class="stats" aria-live="polite" aria-atomic="true"><span>Đã làm <b id="done"></b></span><span class="right">Đúng <b id="correct"></b></span><span class="wrong">Sai <b id="wrong"></b></span></div><button type="button" class="shuffle" id="shuffle">🔀 Trộn lại phần này</button></div><div id="questions">${session.items.map((x,i)=>card(x,i)).join('')}</div><div class="bottom"><div class="actions"><button type="button" class="submit" id="submit">✅ Nộp / Chấm</button><button type="button" class="reset" id="reset">↺ Làm lại</button></div><div id="result" aria-live="polite"></div></div></section>`;
  updateStats();if(session.submitted)renderResult();barObserver.observe(document.getElementById('toolbar'));
  document.getElementById('shuffle').onclick=()=>{sessions[current]=fresh(groups[current]);render();topOfPart()};
  document.getElementById('reset').onclick=()=>{session.items.forEach(x=>x.selected=null);session.submitted=false;render();topOfPart()};
  document.getElementById('submit').onclick=()=>{session.submitted=true;renderResult();document.getElementById('result').scrollIntoView({block:'start',behavior:'auto'})};
 }
 main.insertAdjacentHTML('beforeend','<footer>Đáp án và giải thích giữ nguyên theo tài liệu LMS RDI được cung cấp.<br>Chạy offline · Tiến độ chỉ giữ trong lần mở trang này.</footer>');measure();
}
function renderSummary(){const term=searchTerm.trim(),needle=folded(term),filtered=BANK.filter(q=>folded([q.text,...q.options,q.explanation].join(' ')).includes(needle));document.getElementById('search-count').textContent=`Hiển thị ${filtered.length}/${BANK.length} câu${term?' · Từ khóa được bôi vàng':''}`;document.getElementById('summary-list').innerHTML=filtered.length?filtered.map(q=>card({q,order:[0,1,2,3],selected:null},0,true,term)).join(''):'<p class="empty">Không tìm thấy câu phù hợp. Hãy thử từ khóa khác.</p>'}
function renderResult(){const s=stats(),session=sessions[current],percent=s.correct/s.total*100;const links=predicate=>session.items.map((x,i)=>predicate(x)?`<a href="#q-${i+1}" data-jump="${i+1}">Câu ${i+1}</a>`:'').join('');const wrong=links(x=>x.selected!==null&&x.selected!==x.q.correct),unanswered=links(x=>x.selected===null);document.getElementById('result').innerHTML=`<div class="result ${percent>=80?'pass':'fail'}"><h3>Kết quả Phần ${current+1}</h3><p class="score">${s.correct}/${s.total} <span>(${Number(percent.toFixed(1))}%)</span></p><p class="result-line">Đúng: ${s.correct} · Sai: ${s.wrong} · Chưa làm: ${s.unanswered}</p><p class="${percent>=80?'good-text':'bad-text'}">${percent>=80?'✓ Đạt từ 80% — tiếp tục duy trì!':'Mục tiêu: từ 80%. Hãy ôn lại các câu dưới đây.'}</p>${wrong?`<p class="review-title">Câu sai — bấm để xem lại:</p><div class="review-links">${wrong}</div>`:'<p class="review-title">Không có câu trả lời sai.</p>'}${unanswered?`<p class="review-title">Câu chưa làm:</p><div class="review-links">${unanswered}</div>`:''}</div>`}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-part]');if(!b)return;current=Number(b.dataset.part);render();b.blur();const active=nav.querySelector('[aria-pressed="true"]');active.scrollIntoView({block:'nearest',inline:'nearest'});topOfPart()});
main.addEventListener('click',e=>{const jump=e.target.closest('[data-jump]');if(jump){e.preventDefault();const heading=document.getElementById('title-'+jump.dataset.jump);heading.focus({preventScroll:true});document.getElementById('q-'+jump.dataset.jump).scrollIntoView({block:'start',behavior:'auto'});return}const button=e.target.closest('button[data-option]');if(!button||current===-1)return;const article=button.closest('.question'),id=Number(article.dataset.id),session=sessions[current],i=session.items.findIndex(x=>x.q.id===id),item=session.items[i];if(item.selected!==null)return;item.selected=Number(button.dataset.option);article.outerHTML=card(item,i);updateStats();if(session.submitted)renderResult();document.getElementById('title-'+(i+1)).focus({preventScroll:true})});
render();
</script>
</body>
